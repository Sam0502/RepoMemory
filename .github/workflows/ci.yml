name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: repo_memory
          POSTGRES_USER: repo_memory
          POSTGRES_PASSWORD: repo-memory-password
      neo4j:
        image: neo4j:5.26-community
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/repo-memory-password
    env:
      EMBEDDING_PROVIDER: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Self-scan smoke test
        run: |
          node app/dist/cli.js scan --repo . --full
          node app/dist/cli.js query search "createUser" --all-repos
