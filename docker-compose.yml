services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repo-memory-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: repo_memory
      POSTGRES_USER: repo_memory
      POSTGRES_PASSWORD: repo-memory-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_memory -d repo_memory"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
