name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repo_memory
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d repo_memory"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PG_HOST: localhost
      PG_PORT: 5433
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: repo_memory
      EMBEDDING_PROVIDER: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (8 projects)
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm -r run build

      - name: Test (unit + PG integration)
        run: pnpm test
