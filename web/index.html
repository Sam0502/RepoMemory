<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository Memory Explorer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RepoMemory</h1>
    <nav class="header-nav">
      <button class="nav-btn active" data-view="architecture">Architecture</button>
      <button class="nav-btn" data-view="commits">Commits</button>
      <button class="nav-btn" data-view="analysis">Analysis</button>
      <button class="nav-btn" data-view="ask">Ask</button>
    </nav>
    <div class="search-bar">
      <select id="repoFilter" title="Repository">
        <option value="all">All repos</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search entities..." />
      <button id="searchBtn">Search</button>
    </div>
    <div class="header-stats" id="stats"></div>
  </header>

  <main>
    <aside id="leftPanel" class="panel">
      <div id="entityPanel">
        <div class="panel-header">
          <h2>Entities <span id="entityCount"></span></h2>
          <select id="typeFilter">
            <option value="">All types</option>
            <option value="Class">Class</option>
            <option value="Interface">Interface</option>
            <option value="Function">Function</option>
            <option value="Method">Method</option>
            <option value="Constructor">Constructor</option>
            <option value="Enum">Enum</option>
            <option value="Variable">Variable</option>
            <option value="Property">Property</option>
            <option value="TypeAlias">TypeAlias</option>
            <option value="Test">Test</option>
            <option value="TestSuite">TestSuite</option>
            <option value="ApiEndpoint">ApiEndpoint</option>
            <option value="Config">Config</option>
          </select>
        </div>
        <div id="entityListContent" class="scroll-area"></div>
      </div>
      <div id="commitPanel" class="hidden">
        <div class="panel-header">
          <h2>Recent Commits</h2>
          <button id="commitRefresh" class="icon-btn" title="Refresh">&#x21bb;</button>
        </div>
        <div id="commitListContent" class="scroll-area"></div>
      </div>
      <div id="analysisPanel" class="hidden">
        <div class="panel-header">
          <h2>Analysis</h2>
          <span class="panel-note" title="Reports are computed for the repository this server was started with (serve --repo)">&#9432;</span>
        </div>
        <div class="analysis-tabs">
          <button class="analysis-tab active" data-report="churn">Churn</button>
          <button class="analysis-tab" data-report="risk">Risk</button>
          <button class="analysis-tab" data-report="drift">Drift</button>
          <button class="analysis-tab" data-report="dead-code">Dead code</button>
          <button class="analysis-tab" data-report="ownership">Owners</button>
          <button class="analysis-tab" data-report="boundaries">Bounds</button>
        </div>
        <div id="analysisContent" class="scroll-area"></div>
      </div>
      <div id="qaPanel" class="hidden">
        <div class="panel-header">
          <h2>Ask</h2>
        </div>
        <div class="qa-input-row">
          <input type="text" id="qaInput" placeholder="Ask about the codebase..." />
          <button id="qaBtn">Ask</button>
        </div>
        <div class="qa-suggestions" id="qaSuggestions"></div>
        <div id="qaResult" class="scroll-area"></div>
      </div>
    </aside>

    <section id="graphContainer" class="panel">
      <div class="graph-controls">
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomOut" title="Zoom out">&minus;</button>
        <button id="zoomReset" title="Reset view">Reset</button>
        <select id="depthSelect">
          <option value="1">Depth 1</option>
          <option value="2" selected>Depth 2</option>
          <option value="3">Depth 3</option>
        </select>
      </div>
      <div id="graphLoading" class="graph-overlay hidden">
        <div class="spinner"></div>
        <span>Loading graph...</span>
      </div>
      <svg id="graph"></svg>
    </section>

    <aside id="detailPanel" class="panel hidden">
      <div class="detail-header">
        <h2 id="detailTitle">Entity Details</h2>
        <button id="closeDetail" class="icon-btn" title="Close">&times;</button>
      </div>
      <div id="detailContent" class="scroll-area"></div>
    </aside>
  </main>

  <div id="tooltip" class="tooltip"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
